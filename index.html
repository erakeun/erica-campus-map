<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERICA 캠퍼스 내부구조도 안내</title>
  <meta name="description" content="ERICA 캠퍼스 건물을 검색하고 내부 구조도를 확인할 수 있는 인터랙티브 캠퍼스맵입니다." />

  <style>
    :root{
      --blue:#0b5cab;
      --blue-dark:#073c73;
      --blue-soft:#eaf3fc;
      --ink:#152238;
      --muted:#6b7280;
      --line:#dbe3ec;
      --bg:#f5f7fa;
      --card:#ffffff;
      --shadow:0 12px 40px rgba(21,34,56,.10);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",Arial,sans-serif;
      color:var(--ink);
      background:var(--bg);
    }

    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}

    .page{
      width:min(1800px,100%);
      margin:0 auto;
      padding:24px;
    }

    .hero{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(420px,560px);
      gap:28px;
      align-items:end;
      margin-bottom:16px;
    }

    .version{
      display:inline-flex;
      align-items:center;
      min-height:25px;
      margin-bottom:8px;
      padding:5px 9px;
      border:1px solid #cfe0f1;
      border-radius:999px;
      background:#eef6fe;
      color:var(--blue-dark);
      font-size:11px;
      font-weight:850;
      letter-spacing:.035em;
    }

    .title-wrap h1{
      margin:0 0 7px;
      font-size:clamp(25px,3vw,39px);
      letter-spacing:-.045em;
      line-height:1.15;
    }

    html[lang="en"] .title-wrap h1{letter-spacing:-.025em}

    .title-wrap p{
      margin:0;
      color:var(--muted);
      line-height:1.55;
      font-size:14px;
    }

    .hero-controls{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:10px;
    }

    .language-switch{
      display:inline-grid;
      grid-template-columns:1fr 1fr;
      gap:3px;
      padding:3px;
      border:1px solid #d3dce7;
      border-radius:12px;
      background:#e9eef4;
      box-shadow:0 4px 12px rgba(21,34,56,.05);
    }

    .language-btn{
      min-width:84px;
      height:34px;
      padding:0 13px;
      border:0;
      border-radius:9px;
      background:transparent;
      color:#667085;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
      transition:.16s ease;
    }

    .language-btn:hover{color:var(--blue-dark)}

    .language-btn.is-active{
      background:#fff;
      color:var(--blue-dark);
      box-shadow:0 2px 8px rgba(21,34,56,.11);
    }

    .search-panel{
      width:100%;
      display:flex;
      gap:8px;
      align-items:center;
    }

    .search-box{position:relative;flex:1}

    .search-box input{
      width:100%;
      height:48px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      padding:0 44px 0 16px;
      font-size:15px;
      outline:none;
      box-shadow:0 4px 14px rgba(21,34,56,.05);
      transition:.18s ease;
    }

    .search-box input:focus{
      border-color:#75aee5;
      box-shadow:0 0 0 4px rgba(11,92,171,.10);
    }

    .clear-btn{
      position:absolute;
      right:9px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      color:#8b95a1;
      cursor:pointer;
      font-size:20px;
      width:32px;
      height:32px;
      border-radius:50%;
      display:none;
    }

    .clear-btn:hover{background:#eef3f8}

    .search-btn{
      height:48px;
      padding:0 20px;
      border:0;
      border-radius:14px;
      background:var(--blue);
      color:#fff;
      font-weight:800;
      cursor:pointer;
      white-space:nowrap;
    }

    .search-btn:hover{background:var(--blue-dark)}

    .message{
      min-height:24px;
      margin:0 0 10px;
      color:#52606d;
      font-size:14px;
    }

    .message strong{color:var(--blue-dark)}

    .map-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .map-toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:11px 14px;
      border-bottom:1px solid var(--line);
      background:#fbfcfe;
    }

    .map-toolbar .label{
      color:#697586;
      font-size:13px;
      line-height:1.4;
    }

    .zoom-controls{
      display:flex;
      align-items:center;
      gap:6px;
      flex-shrink:0;
    }

    .zoom-btn{
      height:36px;
      min-width:36px;
      padding:0 11px;
      border:1px solid #ccd7e3;
      border-radius:10px;
      background:#fff;
      color:#344054;
      font-weight:800;
      cursor:pointer;
    }

    .zoom-btn:hover:not(:disabled){
      border-color:#8db9e6;
      background:#f3f8fe;
      color:var(--blue-dark);
    }

    .zoom-btn:disabled{cursor:not-allowed;opacity:.38}

    .zoom-value{
      min-width:58px;
      text-align:center;
      color:#344054;
      font-weight:800;
      font-size:13px;
    }

    .map-scroll{
      width:100%;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      background:#0d2537;
      max-height:78vh;
      overscroll-behavior:contain;
    }

    .map-scroll.can-pan{cursor:grab}
    .map-scroll.is-panning{cursor:grabbing;user-select:none}

    .map-stage{
      position:relative;
      width:100%;
      min-width:860px;
      line-height:0;
      transform-origin:top left;
    }

    .map-stage img{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
      image-rendering:auto;
    }

    .hotspot-layer{position:absolute;inset:0;pointer-events:none}

    .map-hotspot{
      position:absolute;
      width:38px;
      height:38px;
      transform:translate(-50%,-50%);
      border-radius:999px;
      border:0;
      padding:0;
      background:transparent;
      z-index:10;
      cursor:default;
      pointer-events:auto;
    }

    .map-hotspot.is-linked{cursor:pointer}

    .map-hotspot.is-linked:hover{
      background:rgba(255,255,255,.22);
      box-shadow:0 0 0 3px rgba(255,255,255,.92),0 0 0 7px rgba(11,92,171,.62);
    }

    .map-hotspot.search-hit{z-index:30!important}

    .map-hotspot.search-hit::before{
      content:"";
      position:absolute;
      inset:-10px;
      border:4px solid #ff2d55;
      border-radius:999px;
      box-shadow:0 0 0 7px rgba(255,255,255,.94),0 0 28px rgba(255,45,85,.95);
      animation:flashRing .58s ease-in-out 6 alternate;
      pointer-events:none;
    }

    .map-hotspot.search-hit::after{
      content:attr(data-label);
      position:absolute;
      left:50%;
      top:-43px;
      transform:translateX(-50%);
      background:#111827;
      color:#fff;
      line-height:1;
      padding:9px 11px;
      border-radius:9px;
      white-space:nowrap;
      font-size:12px;
      font-weight:800;
      box-shadow:0 8px 20px rgba(0,0,0,.20);
      pointer-events:none;
    }

    @keyframes flashRing{
      from{opacity:.25;transform:scale(.80)}
      to{opacity:1;transform:scale(1.18)}
    }

    .map-hint{
      display:flex;
      flex-wrap:wrap;
      gap:10px 18px;
      align-items:center;
      padding:13px 17px;
      border-top:1px solid var(--line);
      background:#fbfcfe;
      color:#697586;
      font-size:13px;
      line-height:1.45;
    }

    .dot{
      display:inline-block;
      width:9px;
      height:9px;
      border-radius:50%;
      margin-right:6px;
      background:var(--blue);
    }

    .map-toolbar-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

    .facility-master-btn{
      height:36px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:0 12px;
      border:1px solid #ccd7e3;
      border-radius:10px;
      background:#fff;
      color:#344054;
      font-weight:850;
      cursor:pointer;
      white-space:nowrap;
    }

    .facility-master-btn:hover,
    .facility-master-btn.is-open{
      border-color:#8db9e6;
      background:#f3f8fe;
      color:var(--blue-dark);
    }

    .facility-master-icon{font-size:15px;line-height:1}

    .facility-master-count{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:23px;
      height:20px;
      padding:0 6px;
      border-radius:999px;
      background:#eef2f6;
      color:#667085;
      font-size:10px;
      font-weight:900;
    }

    .facility-master-btn.has-active .facility-master-count{
      background:#d9ebfc;
      color:var(--blue-dark);
    }

    .facility-panel{
      border-bottom:1px solid var(--line);
      background:#fff;
      padding:13px 14px 14px;
    }

    .facility-panel[hidden]{display:none}

    .facility-panel-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:11px;
    }

    .facility-panel-title{
      display:block;
      margin-bottom:3px;
      font-size:13px;
      font-weight:900;
      color:#344054;
    }

    .facility-panel-help{
      color:#7a8492;
      font-size:11px;
      line-height:1.45;
    }

    .facility-all-actions{
      display:flex;
      gap:6px;
      flex-shrink:0;
    }

    .facility-small-btn{
      height:30px;
      padding:0 10px;
      border:1px solid #d4dde7;
      border-radius:9px;
      background:#fff;
      color:#475467;
      font-size:11px;
      font-weight:850;
      cursor:pointer;
      white-space:nowrap;
    }

    .facility-small-btn:hover{background:#f6f8fb;color:#1d2939}

    .facility-category-buttons{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .facility-category-btn{
      --cat:#64748b;
      min-height:36px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border:1px solid #d7e0e9;
      border-radius:999px;
      background:#fff;
      color:#475467;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
      transition:.15s ease;
    }

    .facility-category-btn:hover{
      border-color:var(--cat);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--cat) 12%,transparent);
    }

    .facility-category-btn.is-active{
      border-color:var(--cat);
      background:color-mix(in srgb,var(--cat) 10%,white);
      color:#1f2937;
    }

    .facility-category-icon{
      width:22px;
      height:22px;
      display:inline-grid;
      place-items:center;
      border-radius:50%;
      background:var(--cat);
      color:#fff;
      font-size:12px;
      line-height:1;
      box-shadow:0 2px 6px rgba(15,23,42,.16);
    }

    .facility-category-count{
      color:#8490a2;
      font-size:10px;
      font-weight:900;
    }

    .facility-layer{
      position:absolute;
      inset:0;
      z-index:40;
      pointer-events:none;
    }

    .facility-marker{
      --cat:#64748b;
      --dx:0px;
      --dy:-32px;
      position:absolute;
      width:34px;
      height:34px;
      display:none;
      place-items:center;
      border:2px solid rgba(255,255,255,.96);
      border-radius:50%;
      padding:0;
      background:var(--cat);
      color:#fff;
      box-shadow:0 5px 15px rgba(15,23,42,.28),0 0 0 1px rgba(15,23,42,.10);
      transform:translate(-50%,-50%) translate(var(--dx),var(--dy));
      transform-origin:center;
      cursor:pointer;
      pointer-events:auto;
      z-index:41;
      transition:filter .14s ease,box-shadow .14s ease;
    }

    .facility-marker.is-visible{display:grid}

    .facility-marker:hover,
    .facility-marker.is-selected{
      filter:brightness(1.08);
      box-shadow:0 7px 20px rgba(15,23,42,.34),0 0 0 4px rgba(255,255,255,.86),0 0 0 7px color-mix(in srgb,var(--cat) 45%,transparent);
      z-index:65;
    }

    .facility-marker-icon{font-size:16px;line-height:1;pointer-events:none}

    .facility-popup{
      --popup-dx:0px;
      --popup-dy:-32px;
      position:absolute;
      width:min(300px,calc(100vw - 36px));
      z-index:90;
      padding:14px 15px 13px;
      border:1px solid #dbe3ec;
      border-radius:14px;
      background:rgba(255,255,255,.98);
      color:#172033;
      box-shadow:0 16px 38px rgba(15,23,42,.24);
      line-height:1.4;
      transform:translate(-50%,-100%) translate(var(--popup-dx),calc(var(--popup-dy) - 22px));
      pointer-events:auto;
    }

    .facility-popup.is-below{
      transform:translate(-50%,0) translate(var(--popup-dx),calc(var(--popup-dy) + 22px));
    }

    .facility-popup[hidden]{display:none}

    .facility-popup-close{
      position:absolute;
      top:7px;
      right:7px;
      width:28px;
      height:28px;
      border:0;
      border-radius:50%;
      background:transparent;
      color:#7a8492;
      font-size:20px;
      cursor:pointer;
    }

    .facility-popup-close:hover{background:#f1f4f7;color:#344054}

    .facility-popup-category{
      display:flex;
      align-items:center;
      gap:7px;
      margin:0 30px 7px 0;
      color:#667085;
      font-size:11px;
      font-weight:850;
    }

    .facility-popup-icon{
      --cat:#64748b;
      width:24px;
      height:24px;
      display:inline-grid;
      place-items:center;
      border-radius:50%;
      background:var(--cat);
      color:#fff;
      font-size:12px;
      box-shadow:0 2px 6px rgba(15,23,42,.15);
    }

    .facility-popup-name{
      display:block;
      padding-right:22px;
      margin-bottom:6px;
      font-size:15px;
      font-weight:900;
      letter-spacing:-.02em;
      line-height:1.3;
    }

    html[lang="en"] .facility-popup-name{letter-spacing:-.01em}

    .facility-popup-location{
      color:#667085;
      font-size:12px;
      line-height:1.5;
    }

    .facility-popup-link{
      display:inline-flex;
      align-items:center;
      margin-top:10px;
      padding:7px 9px;
      border-radius:8px;
      background:#eef6fe;
      color:var(--blue-dark);
      text-decoration:none;
      font-size:11px;
      font-weight:900;
    }

    .facility-popup-link:hover{background:#dfeefe}

    body.debug .facility-marker{
      outline:2px dashed rgba(255,255,255,.95);
      outline-offset:2px;
    }

    .directory{
      margin-top:24px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .directory-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      padding:22px 24px 18px;
      border-bottom:1px solid var(--line);
    }

    .directory-head h2{
      margin:0 0 5px;
      font-size:22px;
      letter-spacing:-.035em;
    }

    html[lang="en"] .directory-head h2{letter-spacing:-.015em}

    .directory-head p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .directory-legend{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      color:#667085;
      font-size:12px;
    }

    .directory-body{
      padding:20px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:18px;
    }

    .building-group{
      min-width:0;
      border:1px solid #e5ebf2;
      border-radius:15px;
      overflow:hidden;
      background:#fff;
    }

    .building-group h3{
      margin:0;
      padding:11px 14px;
      background:#f6f8fb;
      border-bottom:1px solid #e5ebf2;
      font-size:13px;
      color:#475467;
      letter-spacing:.01em;
    }

    .building-list{display:flex;flex-direction:column}

    .building-row{
      position:relative;
      display:grid;
      grid-template-columns:48px minmax(0,1fr) auto;
      gap:10px;
      align-items:center;
      min-height:45px;
      padding:8px 12px;
      border-bottom:1px solid #eef2f6;
      color:inherit;
      text-decoration:none;
      background:#fff;
      transition:.16s ease;
    }

    .building-row:last-child{border-bottom:0}
    .building-row.is-linked{cursor:pointer}
    .building-row.is-linked:hover{background:#f5f9fe}
    .building-row.is-unlinked{color:#7a8492;cursor:default}

    .building-id{
      font-weight:900;
      color:var(--blue-dark);
      font-variant-numeric:tabular-nums;
    }

    .is-unlinked .building-id{color:#778396}

    .building-name{
      min-width:0;
      font-size:13px;
      font-weight:700;
      line-height:1.35;
      word-break:keep-all;
      overflow-wrap:anywhere;
    }

    .building-status{
      flex-shrink:0;
      border-radius:999px;
      padding:5px 8px;
      font-size:10px;
      font-weight:800;
      line-height:1;
      white-space:nowrap;
    }

    .is-linked .building-status{background:var(--blue-soft);color:var(--blue-dark)}
    .is-unlinked .building-status{background:#f1f3f5;color:#8a94a3}

    .building-row.search-hit{
      z-index:2;
      background:#fff8cb;
      box-shadow:inset 0 0 0 3px #ff2d55;
      animation:listFlash .58s ease-in-out 6 alternate;
    }

    @keyframes listFlash{
      from{filter:brightness(.96)}
      to{filter:brightness(1.08)}
    }

    .footer{
      display:flex;
      justify-content:space-between;
      gap:16px;
      margin:14px 2px 0;
      color:#8a94a3;
      font-size:12px;
      line-height:1.6;
    }

    .footer-version{white-space:nowrap;font-weight:750}

    body.debug .map-hotspot{
      background:rgba(255,0,0,.25);
      box-shadow:inset 0 0 0 2px rgba(255,0,0,.78);
    }

    @media (max-width:1050px){
      .map-toolbar-actions{width:100%;justify-content:space-between}
      .facility-panel-top{flex-direction:column}
      .facility-all-actions{align-self:flex-end}
    }

    @media (max-width:1200px){
      .directory-body{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

    @media (max-width:900px){
      .page{padding:14px}
      .hero{grid-template-columns:1fr;gap:14px}
      .hero-controls{align-items:stretch}
      .language-switch{align-self:flex-end}
      .search-panel{width:100%}
      .map-card,.directory{border-radius:14px}
      .map-stage{min-width:1050px}
      .map-scroll{max-height:72vh}
      .map-toolbar{align-items:flex-start;flex-direction:column}
      .map-toolbar-actions{width:100%;flex-wrap:wrap}
      .facility-master-btn{margin-right:auto}
      .zoom-controls{margin-left:auto}
      .facility-panel{padding:12px}
      .facility-category-buttons{gap:6px}
      .facility-category-btn{font-size:11px;padding:6px 9px}
      .directory-body{grid-template-columns:1fr;padding:13px}
      .directory-head{align-items:flex-start;flex-direction:column;padding:18px}
      .title-wrap p{font-size:13px}
      .footer{flex-direction:column}
    }

    @media (max-width:520px){
      .search-btn{padding:0 15px}
      .language-btn{min-width:76px}
      .building-row{grid-template-columns:43px minmax(0,1fr) auto;padding:8px 10px}
      html[lang="en"] .building-row{grid-template-columns:43px minmax(0,1fr)}
      html[lang="en"] .building-status{grid-column:2;justify-self:start;margin-top:1px}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important}
      .map-hotspot.search-hit::before,.building-row.search-hit{animation:none}
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="title-wrap">
        <div class="version">V2.2.0 · FACILITY LAYERS</div>
        <h1 id="pageTitle">ERICA 캠퍼스 내부구조도 안내</h1>
        <p id="pageDescription"></p>
      </div>

      <div class="hero-controls">
        <div class="language-switch" id="languageSwitch" role="group" aria-label="언어 선택">
          <button class="language-btn" type="button" data-lang="ko" aria-pressed="true">한국어</button>
          <button class="language-btn" type="button" data-lang="en" aria-pressed="false">English</button>
        </div>

        <div class="search-panel">
          <div class="search-box">
            <input id="searchInput" type="search" autocomplete="off" />
            <button class="clear-btn" id="clearBtn" type="button">×</button>
          </div>
          <button class="search-btn" id="searchBtn" type="button"></button>
        </div>
      </div>
    </section>

    <div class="message" id="message" aria-live="polite"></div>

    <section class="map-card">

function t(){ return UI[currentLang]; }
function displayName(b){ return currentLang === "en" ? b.nameEn : b.nameKo; }
function facilityDisplayName(f){ return currentLang === "en" ? f.nameEn : f.nameKo; }
function facilityFloor(f){ return currentLang === "en" ? f.floorEn : f.floorKo; }
function facilityCategoryLabel(key){
  const c = FACILITY_CATEGORIES[key];
  return currentLang === "en" ? c.en : c.ko;
}
function buildingById(id){ return BUILDINGS.find(b => b.id === id); }

function buildingUrl(b){
  if(currentLang === "ko") return (b.urlKo || "").trim();
  const englishUrl = (b.urlEn || "").trim();
  if(englishUrl) return englishUrl;
  return SETTINGS.englishUrlFallbackToKorean ? (b.urlKo || "").trim() : "";
}

function hasUrl(b){ return buildingUrl(b).length > 0; }

function normalize(s){
  return String(s ?? "")
    .toLowerCase()
    .normalize("NFKC")
    .replace(/[^\p{L}\p{N}]+/gu,"");
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function convertedY(originalPercent){
  return originalPercent * ORIGINAL_MAP_HEIGHT / CROPPED_MAP_HEIGHT;
}

function updateUrlLanguage(){
  const next = new URL(location.href);
  if(currentLang === "en") next.searchParams.set("lang","en");
  else next.searchParams.delete("lang");
  history.replaceState(null,"",next);
}

function facilityOffsets(count,index){
  if(count <= 1) return [0,-34];
  if(count <= 5){
    const radius = 39;
    const angle = -Math.PI / 2 + index * (Math.PI * 2 / count);
    return [Math.round(Math.cos(angle) * radius),Math.round(Math.sin(angle) * radius)];
  }
  if(count <= 9){
    const radius = 50;
    const angle = -Math.PI / 2 + index * (Math.PI * 2 / count);
    return [Math.round(Math.cos(angle) * radius),Math.round(Math.sin(angle) * radius)];
  }
  const outerCount = Math.ceil(count * .64);
  if(index < outerCount){
    const radius = 58;
    const angle = -Math.PI / 2 + index * (Math.PI * 2 / outerCount);
    return [Math.round(Math.cos(angle) * radius),Math.round(Math.sin(angle) * radius)];
  }
  const innerIndex = index - outerCount;
  const innerCount = count - outerCount;
  const radius = 34;
  const angle = -Math.PI / 2 + innerIndex * (Math.PI * 2 / innerCount) + .35;
  return [Math.round(Math.cos(angle) * radius),Math.round(Math.sin(angle) * radius)];
}

function renderFacilityMarkers(){
  facilityLayer.replaceChildren();
  facilityMarkerEls.clear();
  selectedFacilityId = null;
  facilityPopup.hidden = true;

  FACILITIES.forEach(f => {
    const b = buildingById(f.buildingId);
    if(!b) return;
    const c = FACILITY_CATEGORIES[f.category];
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "facility-marker";
    btn.dataset.facilityId = f.id;
    btn.dataset.category = f.category;
    btn.style.left = b.x + "%";
    btn.style.top = convertedY(b.y) + "%";
    btn.style.setProperty("--cat",c.color);
    btn.innerHTML = `<span class="facility-marker-icon" aria-hidden="true">${c.icon}</span>`;
    const label = `${facilityDisplayName(f)} · ${displayName(b)} ${facilityFloor(f)}`;
    btn.title = label;
    btn.setAttribute("aria-label",label);
    btn.addEventListener("click",e => {
      e.stopPropagation();
      openFacilityPopup(f,btn);
    });
    facilityLayer.appendChild(btn);
    facilityMarkerEls.set(f.id,btn);
  });

  updateFacilityVisibility();
}

function updateFacilityVisibility(){
  const visible = FACILITIES.filter(f => activeFacilityCategories.has(f.category));
  const groups = new Map();
  visible.forEach(f => {
    if(!groups.has(f.buildingId)) groups.set(f.buildingId,[]);
    groups.get(f.buildingId).push(f);
  });

  FACILITIES.forEach(f => {
    const el = facilityMarkerEls.get(f.id);
    if(!el) return;
    const show = activeFacilityCategories.has(f.category);
    el.classList.toggle("is-visible",show);
    if(!show) el.classList.remove("is-selected");
  });

  groups.forEach(items => {
    items.forEach((f,index) => {
      const [dx,dy] = facilityOffsets(items.length,index);
      const el = facilityMarkerEls.get(f.id);
      if(!el) return;
      el.style.setProperty("--dx",dx + "px");
      el.style.setProperty("--dy",dy + "px");
      el.dataset.dx = String(dx);
      el.dataset.dy = String(dy);
    });
  });

  updateFacilityMasterCount();
}

function openFacilityPopup(f,marker){
  const b = buildingById(f.buildingId);
  if(!b) return;
  selectedFacilityId = f.id;
  facilityMarkerEls.forEach(el => el.classList.toggle("is-selected",el === marker));

  const c = FACILITY_CATEGORIES[f.category];
  const linked = hasUrl(b);
  const linkHtml = linked
    ? `<a class="facility-popup-link" href="${escapeHtml(buildingUrl(b))}" target="_blank" rel="noopener noreferrer">${escapeHtml(t().facilityFloorPlan)}</a>`
    : "";

  facilityPopup.innerHTML = `
    <button class="facility-popup-close" type="button" aria-label="${escapeHtml(t().facilityCloseAria)}">×</button>
    <div class="facility-popup-category"><span class="facility-popup-icon" style="--cat:${c.color}" aria-hidden="true">${c.icon}</span><span>${escapeHtml(facilityCategoryLabel(f.category))}</span></div>
    <strong class="facility-popup-name">${escapeHtml(facilityDisplayName(f))}</strong>
    <div class="facility-popup-location">${escapeHtml(t().facilityPopupLocation(displayName(b),facilityFloor(f)))}</div>
    ${linkHtml}
  `;
  facilityPopup.style.left = b.x + "%";
  facilityPopup.style.top = convertedY(b.y) + "%";
  facilityPopup.style.setProperty("--popup-dx",(marker.dataset.dx || "0") + "px");
  facilityPopup.style.setProperty("--popup-dy",(marker.dataset.dy || "-34") + "px");
  facilityPopup.classList.toggle("is-below",convertedY(b.y) < 24);
  facilityPopup.hidden = false;
  facilityPopup.querySelector(".facility-popup-close").addEventListener("click",e => {
    e.stopPropagation();
    closeFacilityPopup();
  });
}

function closeFacilityPopup(){
  selectedFacilityId = null;
  facilityPopup.hidden = true;
  facilityMarkerEls.forEach(el => el.classList.remove("is-selected"));
}

facilityMasterBtn.addEventListener("click",() => toggleFacilityPanel());
facilityAllOn.addEventListener("click",() => setAllFacilityCategories(true));
facilityAllOff.addEventListener("click",() => setAllFacilityCategories(false));

function groupKey(b){ return b.id.charAt(0); }

function renderDirectory(){
  directoryBody.replaceChildren();
  rowEls.clear();
  const groups = new Map();

  BUILDINGS.forEach(b => {
    const key = groupKey(b);
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(b);
  });

  groups.forEach((items,key) => {
    const group = document.createElement("section");
    group.className = "building-group";

    const h3 = document.createElement("h3");
    h3.textContent = t().group(key);
    group.appendChild(h3);

    const list = document.createElement("div");
    list.className = "building-list";

    items.forEach(b => {
      const linked = hasUrl(b);
      const name = displayName(b);
      const row = document.createElement(linked ? "a" : "div");
      row.className = "building-row " + (linked ? "is-linked" : "is-unlinked");
      row.dataset.id = b.id;

      if(linked){
        row.href = buildingUrl(b);
        row.target = "_blank";
        row.rel = "noopener noreferrer";
        row.title = t().openTitle(b.id,name);
        row.setAttribute("aria-label",t().openAria(b.id,name));
      }

      row.innerHTML = `
        <span class="building-id">${escapeHtml(b.id)}</span>
        <span class="building-name">${escapeHtml(name)}</span>
        <span class="building-status">${linked ? t().view : t().pending}</span>
      `;

      list.appendChild(row);
      rowEls.set(b.id,row);
    });

    group.appendChild(list);
    directoryBody.appendChild(group);
  });
}

function applyLanguage({preserveSearch=true,updateUrl=true}={}){
  const ui = t();
  document.documentElement.lang = currentLang;
  document.title = ui.title;
  document.querySelector('meta[name="description"]').setAttribute("content",ui.metaDescription);

  pageTitle.textContent = ui.title;
  pageDescription.innerHTML = ui.description;
  languageSwitch.setAttribute("aria-label",ui.languageLabel);
  searchInput.placeholder = ui.searchPlaceholder;
  searchInput.setAttribute("aria-label",ui.searchAria);
  clearBtn.setAttribute("aria-label",ui.clearAria);
  searchBtn.textContent = ui.searchButton;
  mapToolbarLabel.textContent = ui.toolbar;
  zoomControls.setAttribute("aria-label",ui.zoomAria);
  zoomOut.setAttribute("aria-label",ui.zoomOutAria);
  zoomIn.setAttribute("aria-label",ui.zoomInAria);
  zoomReset.setAttribute("aria-label",ui.resetAria);
  campusMap.src = SETTINGS.mapImages[currentLang];
  campusMap.alt = ui.mapAlt;
  hintLinked.textContent = ui.hintLinked;
  hintSearch.textContent = ui.hintSearch;
  directoryTitle.textContent = ui.directoryTitle;
  directoryDescription.textContent = ui.directoryDescription;
  legendLinked.textContent = ui.legendLinked;
  legendPending.textContent = ui.legendPending;
  footerText.textContent = ui.footer;
  renderFacilityControls();
  renderFacilityMarkers();

  languageButtons.forEach(btn => {
    const active = btn.dataset.lang === currentLang;
    btn.classList.toggle("is-active",active);
    btn.setAttribute("aria-pressed",String(active));
  });

  renderMapHotspots();
  renderDirectory();
  clearHighlights();

  if(preserveSearch && searchInput.value.trim()) searchBuildings(false);
  else if(!params.has("debug")) message.textContent = "";

  saveLanguage(currentLang);
  if(updateUrl) updateUrlLanguage();
  if(params.get("debug") === "1") message.innerHTML = ui.debug;
}

languageButtons.forEach(btn => {
  btn.addEventListener("click",() => {
    if(btn.dataset.lang === currentLang) return;
    currentLang = btn.dataset.lang;
    applyLanguage();
  });
});

function updateZoom(nextZoom,focusX=.5,focusY=.5){
  const oldZoom = zoom;
  zoom = Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,nextZoom));

  if(zoom === oldZoom){ updateZoomControls(); return; }

  const oldWidth = stage.scrollWidth;
  const oldHeight = stage.scrollHeight;
  const viewportW = mapScroll.clientWidth;
  const viewportH = mapScroll.clientHeight;
  const contentX = (mapScroll.scrollLeft + viewportW * focusX) / Math.max(oldWidth,1);
  const contentY = (mapScroll.scrollTop + viewportH * focusY) / Math.max(oldHeight,1);
  const minStageWidth = parseFloat(getComputedStyle(stage).minWidth) || 0;

  stage.style.width = `max(${zoom * 100}%, ${zoom * minStageWidth}px)`;

  requestAnimationFrame(() => {
    const newWidth = stage.scrollWidth;
    const newHeight = stage.scrollHeight;
    mapScroll.scrollLeft = Math.max(0,contentX * newWidth - viewportW * focusX);
    mapScroll.scrollTop = Math.max(0,contentY * newHeight - viewportH * focusY);
    updateZoomControls();
  });
}

function updateZoomControls(){
  zoomValue.textContent = Math.round(zoom * 100) + "%";
  zoomOut.disabled = zoom <= ZOOM_MIN;
  zoomIn.disabled = zoom >= ZOOM_MAX;
  mapScroll.classList.toggle("can-pan",zoom > 1);
}

zoomOut.addEventListener("click",() => updateZoom(zoom - ZOOM_STEP));
zoomIn.addEventListener("click",() => updateZoom(zoom + ZOOM_STEP));
zoomReset.addEventListener("click",() => {
  zoom = 1;
  stage.style.width = "";
  mapScroll.scrollTo({left:0,top:0,behavior:"smooth"});
  updateZoomControls();
});

mapScroll.addEventListener("wheel",e => {
  if(!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const rect = mapScroll.getBoundingClientRect();
  const fx = Math.min(1,Math.max(0,(e.clientX - rect.left) / rect.width));
  const fy = Math.min(1,Math.max(0,(e.clientY - rect.top) / rect.height));
  updateZoom(zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP),fx,fy);
},{passive:false});

let panState = null;
mapScroll.addEventListener("pointerdown",e => {
  if(zoom <= 1 || e.button !== 0 || e.target.closest(".map-hotspot,.facility-marker,.facility-popup")) return;
  panState = {x:e.clientX,y:e.clientY,left:mapScroll.scrollLeft,top:mapScroll.scrollTop,id:e.pointerId};
  mapScroll.classList.add("is-panning");
  mapScroll.setPointerCapture(e.pointerId);
});
mapScroll.addEventListener("pointermove",e => {
  if(!panState || panState.id !== e.pointerId) return;
  mapScroll.scrollLeft = panState.left - (e.clientX - panState.x);
  mapScroll.scrollTop = panState.top - (e.clientY - panState.y);
});
function stopPan(e){
  if(!panState || (e && panState.id !== e.pointerId)) return;
  panState = null;
  mapScroll.classList.remove("is-panning");
}
mapScroll.addEventListener("pointerup",stopPan);
mapScroll.addEventListener("pointercancel",stopPan);
mapScroll.addEventListener("click",e => {
  if(e.target.closest(".facility-marker,.facility-popup,.map-hotspot")) return;
  closeFacilityPopup();
});

function clearHighlights(){
  document.querySelectorAll(".search-hit").forEach(el => el.classList.remove("search-hit"));
}

function highlightBuilding(b,shouldScroll=true){
  const mapEl = mapEls.get(b.id);
  const rowEl = rowEls.get(b.id);

  if(mapEl){
    mapEl.classList.remove("search-hit");
    void mapEl.offsetWidth;
    mapEl.classList.add("search-hit");
  }

  if(rowEl){
    rowEl.classList.remove("search-hit");
    void rowEl.offsetWidth;
    rowEl.classList.add("search-hit");
  }

  if(shouldScroll && mapEl){
    mapScroll.scrollTo({
      left:Math.max(0,mapEl.offsetLeft - mapScroll.clientWidth / 2),
      top:Math.max(0,mapEl.offsetTop - mapScroll.clientHeight / 2),
      behavior:"smooth"
    });
  }
}

function searchBuildings(shouldScroll=true){
  const raw = searchInput.value.trim();
  clearHighlights();

  if(!raw){
    message.textContent = "";
    clearBtn.style.display = "none";
    return;
  }

  clearBtn.style.display = "block";
  const q = normalize(raw);

  let results = BUILDINGS.filter(b => {
    const fields = [b.id,b.nameKo,b.nameEn,...(b.aliasesKo || []),...(b.aliasesEn || [])].map(normalize);
    return fields.some(v => v.includes(q));
  });

  const exactId = BUILDINGS.find(b => normalize(b.id) === q);
  if(exactId) results = [exactId];

  if(results.length === 0){
    message.innerHTML = t().noResult(escapeHtml(raw));
    return;
  }

  results.forEach((b,i) => highlightBuilding(b,shouldScroll && i === 0));
  message.innerHTML = results.length === 1
    ? t().oneResult(results[0],hasUrl(results[0]))
    : t().manyResults(results);
}

searchBtn.addEventListener("click",() => searchBuildings(true));
searchInput.addEventListener("keydown",e => { if(e.key === "Enter") searchBuildings(true); });
searchInput.addEventListener("input",() => { clearBtn.style.display = searchInput.value ? "block" : "none"; });
clearBtn.addEventListener("click",() => {
  searchInput.value = "";
  clearHighlights();
  message.textContent = "";
  clearBtn.style.display = "none";
  searchInput.focus();
});

if(params.get("debug") === "1") document.body.classList.add("debug");
updateZoomControls();
applyLanguage({preserveSearch:false,updateUrl:false});
</script>
