<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERICA 캠퍼스 내부구조도 안내</title>
  <meta name="description" content="ERICA 캠퍼스 건물을 검색하고 내부 구조도를 확인할 수 있는 인터랙티브 캠퍼스맵입니다." />

  <style>
    :root{
      --blue:#0b5cab;
      --blue-dark:#073c73;
      --ink:#152238;
      --muted:#6b7280;
      --line:#dbe3ec;
      --bg:#f5f7fa;
      --card:#ffffff;
      --shadow:0 12px 40px rgba(21,34,56,.10);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;
      color:var(--ink);
      background:var(--bg);
    }

    .page{
      width:min(1600px,100%);
      margin:0 auto;
      padding:24px;
    }

    .hero{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:24px;
      margin-bottom:16px;
    }

    .title-wrap h1{
      margin:0 0 7px;
      font-size:clamp(24px,3vw,38px);
      letter-spacing:-.045em;
    }

    .title-wrap p{
      margin:0;
      color:var(--muted);
      line-height:1.55;
      font-size:14px;
    }

    .search-panel{
      flex:0 1 520px;
      display:flex;
      gap:8px;
      align-items:center;
    }

    .search-box{
      position:relative;
      flex:1;
    }

    .search-box input{
      width:100%;
      height:48px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      padding:0 44px 0 16px;
      font-size:15px;
      outline:none;
      box-shadow:0 4px 14px rgba(21,34,56,.05);
      transition:.18s ease;
    }

    .search-box input:focus{
      border-color:#75aee5;
      box-shadow:0 0 0 4px rgba(11,92,171,.10);
    }

    .clear-btn{
      position:absolute;
      right:9px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      color:#8b95a1;
      cursor:pointer;
      font-size:20px;
      width:32px;
      height:32px;
      border-radius:50%;
      display:none;
    }
    .clear-btn:hover{background:#eef3f8}

    .search-btn{
      height:48px;
      padding:0 20px;
      border:0;
      border-radius:14px;
      background:var(--blue);
      color:#fff;
      font-weight:750;
      cursor:pointer;
      white-space:nowrap;
    }
    .search-btn:hover{background:var(--blue-dark)}

    .message{
      min-height:24px;
      margin:0 0 10px;
      color:#52606d;
      font-size:14px;
    }
    .message strong{color:var(--blue-dark)}

    .map-card{
      position:relative;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .map-scroll{
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      background:#fff;
    }

    /* 모바일에서는 이미지가 너무 작아지지 않게 최소 폭을 둔다. */
    .map-stage{
      position:relative;
      width:100%;
      min-width:900px;
      line-height:0;
    }

    .map-stage img{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
    }

    /*
      지도 위 번호 클릭 영역.
      URL이 비어 있어도 검색 강조는 가능하지만, 클릭 이동은 하지 않는다.
    */
    .map-hotspot{
      position:absolute;
      width:clamp(26px,2.15vw,38px);
      aspect-ratio:1/1;
      transform:translate(-50%,-50%);
      border-radius:999px;
      border:0;
      padding:0;
      background:transparent;
      z-index:10;
      cursor:default;
    }

    .map-hotspot.is-linked{cursor:pointer}
    .map-hotspot.is-linked:hover{
      background:rgba(255,255,255,.20);
      box-shadow:0 0 0 3px rgba(255,255,255,.92),0 0 0 7px rgba(11,92,171,.55);
    }

    /* 하단 범례(이미지 속 건물명) 위에 얹는 투명 클릭 영역 */
    .legend-hotspot{
      position:absolute;
      z-index:9;
      border:0;
      background:transparent;
      border-radius:5px;
      padding:0;
      cursor:default;
    }

    .legend-hotspot.is-linked{cursor:pointer}
    .legend-hotspot.is-linked:hover{
      background:rgba(11,92,171,.10);
      outline:2px solid rgba(11,92,171,.30);
    }

    /* 검색 시 지도 번호 + 하단 건물명 모두 번쩍 */
    .search-hit{
      z-index:30 !important;
    }

    .map-hotspot.search-hit::before{
      content:"";
      position:absolute;
      inset:-9px;
      border:4px solid #ff2d55;
      border-radius:999px;
      box-shadow:0 0 0 7px rgba(255,255,255,.92), 0 0 26px rgba(255,45,85,.95);
      animation:flashRing .58s ease-in-out 6 alternate;
      pointer-events:none;
    }

    .map-hotspot.search-hit::after{
      content:attr(data-label);
      position:absolute;
      left:50%;
      top:-40px;
      transform:translateX(-50%);
      background:#111827;
      color:#fff;
      line-height:1;
      padding:8px 10px;
      border-radius:9px;
      white-space:nowrap;
      font-size:12px;
      font-weight:800;
      box-shadow:0 8px 20px rgba(0,0,0,.20);
      pointer-events:none;
    }

    .legend-hotspot.search-hit{
      background:rgba(255,230,0,.28);
      outline:3px solid #ff2d55;
      box-shadow:0 0 18px rgba(255,45,85,.42);
      animation:legendFlash .58s ease-in-out 6 alternate;
    }

    @keyframes flashRing{
      from{opacity:.2; transform:scale(.80)}
      to{opacity:1; transform:scale(1.16)}
    }

    @keyframes legendFlash{
      from{opacity:.35}
      to{opacity:1}
    }

    .hint{
      display:flex;
      flex-wrap:wrap;
      gap:10px 18px;
      align-items:center;
      padding:13px 17px;
      border-top:1px solid var(--line);
      background:#fbfcfe;
      color:#697586;
      font-size:13px;
      line-height:1.4;
    }

    .dot{
      display:inline-block;
      width:9px;
      height:9px;
      border-radius:50%;
      margin-right:6px;
      background:var(--blue);
    }

    .footer{
      margin:14px 2px 0;
      color:#8a94a3;
      font-size:12px;
      line-height:1.6;
    }

    /* 디버그 모드: 주소 뒤에 ?debug=1 을 붙이면 클릭 영역이 보인다. */
    body.debug .map-hotspot{
      background:rgba(255,0,0,.22);
      box-shadow:inset 0 0 0 2px rgba(255,0,0,.75);
    }
    body.debug .legend-hotspot{
      background:rgba(0,110,255,.14);
      outline:1px solid rgba(0,110,255,.65);
    }

    @media (max-width:900px){
      .page{padding:14px}
      .hero{align-items:stretch;flex-direction:column;gap:14px}
      .search-panel{flex-basis:auto;width:100%}
      .map-card{border-radius:14px}
      .map-stage{min-width:1050px}
      .title-wrap p{font-size:13px}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important}
      .map-hotspot.search-hit::before,
      .legend-hotspot.search-hit{animation:none}
    }
  </style>
</head>

function normalize(s){
  return String(s ?? "")
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace(/[·ㆍ\-_/()[\]]/g,"");
}

function hasUrl(b){
  return typeof b.url === "string" && b.url.trim().length > 0;
}

function openBuilding(b){
  if(!hasUrl(b)) return;
  window.open(b.url.trim(), "_blank", "noopener,noreferrer");
}

function makeMapHotspot(b){
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "map-hotspot" + (hasUrl(b) ? " is-linked" : "");
  btn.style.left = b.x + "%";
  btn.style.top = b.y + "%";
  btn.dataset.id = b.id;
  btn.dataset.label = `${b.id} ${b.name}`;
  btn.setAttribute("aria-label", `${b.id} ${b.name}` + (hasUrl(b) ? " 내부 구조도 열기" : " 위치"));
  btn.title = hasUrl(b) ? `${b.id} ${b.name} · 내부 구조도 보기` : `${b.id} ${b.name}`;
  btn.addEventListener("click", () => openBuilding(b));
  stage.appendChild(btn);
  mapEls.set(b.id, btn);
}

function makeLegendHotspot(b){
  if(!b.legend) return;
  const [groupKey, rowIndex] = b.legend;
  const g = LEGEND_GROUPS[groupKey];
  if(!g) return;

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "legend-hotspot" + (hasUrl(b) ? " is-linked" : "");
  btn.style.left = g.x + "%";
  btn.style.top = (g.y + g.row * rowIndex) + "%";
  btn.style.width = g.w + "%";
  btn.style.height = (g.row * .90) + "%";
  btn.dataset.id = b.id;
  btn.setAttribute("aria-label", `${b.id} ${b.name}` + (hasUrl(b) ? " 내부 구조도 열기" : " 위치"));
  btn.title = hasUrl(b) ? `${b.id} ${b.name} · 내부 구조도 보기` : `${b.id} ${b.name}`;
  btn.addEventListener("click", () => openBuilding(b));
  stage.appendChild(btn);
  legendEls.set(b.id, btn);
}

BUILDINGS.forEach(b => {
  makeMapHotspot(b);
  makeLegendHotspot(b);
});

function clearHighlights(){
  document.querySelectorAll(".search-hit").forEach(el => el.classList.remove("search-hit"));
}

function highlightBuilding(b, shouldScroll=true){
  const m = mapEls.get(b.id);
  const l = legendEls.get(b.id);
  if(m){
    /* 애니메이션을 검색할 때마다 다시 재생 */
    m.classList.remove("search-hit");
    void m.offsetWidth;
    m.classList.add("search-hit");
  }
  if(l){
    l.classList.remove("search-hit");
    void l.offsetWidth;
    l.classList.add("search-hit");
  }

  if(shouldScroll && m){
    const left = m.offsetLeft - mapScroll.clientWidth / 2;
    const top  = m.offsetTop  - mapScroll.clientHeight / 2;
    mapScroll.scrollTo({
      left: Math.max(0,left),
      top: Math.max(0,top),
      behavior:"smooth"
    });
  }
}

function searchBuildings(){
  const raw = searchInput.value.trim();
  clearHighlights();

  if(!raw){
    message.textContent = "";
    clearBtn.style.display = "none";
    return;
  }

  clearBtn.style.display = "block";
  const q = normalize(raw);

  let results = BUILDINGS.filter(b => {
    const fields = [b.id,b.name,...(b.aliases || [])].map(normalize);
    return fields.some(v => v.includes(q));
  });

  /* 건물번호 완전일치가 있으면 그것을 최우선으로 */
  const exactId = BUILDINGS.find(b => normalize(b.id) === q);
  if(exactId) results = [exactId];

  if(results.length === 0){
    message.innerHTML = `‘<strong>${escapeHtml(raw)}</strong>’에 해당하는 건물을 찾지 못했습니다.`;
    return;
  }

  results.forEach((b,i) => highlightBuilding(b, i === 0));

  if(results.length === 1){
    const b = results[0];
    message.innerHTML =
      `<strong>${b.id} ${escapeHtml(b.name)}</strong> 위치를 표시했습니다.` +
      (hasUrl(b) ? ` 지도 번호 또는 하단 건물명을 누르면 내부 구조도가 열립니다.` : ` 현재 내부 구조도 링크는 연결되어 있지 않습니다.`);
  }else{
    message.innerHTML =
      `<strong>${results.length}개</strong> 건물이 검색되었습니다: ` +
      results.slice(0,8).map(b => `${b.id} ${escapeHtml(b.name)}`).join(", ") +
      (results.length > 8 ? "…" : "");
  }
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

searchBtn.addEventListener("click", searchBuildings);
searchInput.addEventListener("keydown", e => {
  if(e.key === "Enter") searchBuildings();
});
searchInput.addEventListener("input", () => {
  clearBtn.style.display = searchInput.value ? "block" : "none";
});
clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  clearHighlights();
  message.textContent = "";
  clearBtn.style.display = "none";
  searchInput.focus();
});

/* ?debug=1 : 클릭영역 확인 */
const params = new URLSearchParams(location.search);
if(params.get("debug") === "1"){
  document.body.classList.add("debug");
  message.innerHTML = "<strong>DEBUG MODE</strong> · 빨강=지도 번호 클릭영역 / 파랑=하단 범례 클릭영역";
}
</script>
