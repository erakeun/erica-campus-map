<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERICA 캠퍼스맵</title>
  <meta name="description" content="ERICA 캠퍼스의 건물·시설·흡연구역·캠퍼스혁신파크를 한눈에 확인하는 인터랙티브 캠퍼스맵입니다." />

  <style>
    :root{
      --blue:#0b5cab;
      --blue-dark:#073c73;
      --blue-soft:#eaf3fc;
      --ink:#152238;
      --muted:#6b7280;
      --line:#dbe3ec;
      --bg:#f5f7fa;
      --card:#ffffff;
      --shadow:0 12px 40px rgba(21,34,56,.10);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Noto Sans SC","Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;
      color:var(--ink);
      background:var(--bg);
    }

    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}

    .page{
      width:min(1800px,100%);
      margin:0 auto;
      padding:24px;
    }

    .hero{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(420px,560px);
      gap:28px;
      align-items:end;
      margin-bottom:16px;
    }

    .version{
      display:inline-flex;
      align-items:center;
      min-height:25px;
      margin-bottom:8px;
      padding:5px 9px;
      border:1px solid #cfe0f1;
      border-radius:999px;
      background:#eef6fe;
      color:var(--blue-dark);
      font-size:11px;
      font-weight:850;
      letter-spacing:.035em;
    }

    .title-wrap h1{
      margin:0 0 7px;
      font-size:clamp(25px,3vw,39px);
      letter-spacing:-.045em;
      line-height:1.15;
    }

    html[lang="en"] .title-wrap h1{letter-spacing:-.025em}
    html[lang="zh-CN"] .title-wrap h1{letter-spacing:-.02em}

    .title-wrap p{
      margin:0;
      color:var(--muted);
      line-height:1.55;
      font-size:14px;
    }

    .hero-controls{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:10px;
    }

    .language-switch{
      display:inline-grid;
      grid-template-columns:repeat(3,1fr);
      gap:3px;
      padding:3px;
      border:1px solid #d3dce7;
      border-radius:12px;
      background:#e9eef4;
      box-shadow:0 4px 12px rgba(21,34,56,.05);
    }

    .language-btn{
      min-width:78px;
      height:34px;
      padding:0 13px;
      border:0;
      border-radius:9px;
      background:transparent;
      color:#667085;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
      transition:.16s ease;
    }

    .language-btn:hover{color:var(--blue-dark)}

    .language-btn.is-active{
      background:#fff;
      color:var(--blue-dark);
      box-shadow:0 2px 8px rgba(21,34,56,.11);
    }

    .search-panel{
      width:100%;
      display:flex;
      gap:8px;
      align-items:center;
    }

    .search-box{position:relative;flex:1}

    .search-box input{
      width:100%;
      height:48px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      padding:0 44px 0 16px;
      font-size:15px;
      outline:none;
      box-shadow:0 4px 14px rgba(21,34,56,.05);
      transition:.18s ease;
    }

    .search-box input:focus{
      border-color:#75aee5;
      box-shadow:0 0 0 4px rgba(11,92,171,.10);
    }

    .clear-btn{
      position:absolute;
      right:9px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      color:#8b95a1;
      cursor:pointer;
      font-size:20px;
      width:32px;
      height:32px;
      border-radius:50%;
      display:none;
    }

    .clear-btn:hover{background:#eef3f8}

    .search-btn{
      height:48px;
      padding:0 20px;
      border:0;
      border-radius:14px;
      background:var(--blue);
      color:#fff;
      font-weight:800;
      cursor:pointer;
      white-space:nowrap;
    }

    .search-btn:hover{background:var(--blue-dark)}

    .message{
      min-height:24px;
      margin:0 0 10px;
      color:#52606d;
      font-size:14px;
    }

    .message strong{color:var(--blue-dark)}

    .map-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .map-toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:11px 14px;
      border-bottom:1px solid var(--line);
      background:#fbfcfe;
    }

    .map-toolbar .label{
      color:#697586;
      font-size:13px;
      line-height:1.4;
    }

    .zoom-controls{
      display:flex;
      align-items:center;
      gap:6px;
      flex-shrink:0;
    }

    .zoom-btn{
      height:36px;
      min-width:36px;
      padding:0 11px;
      border:1px solid #ccd7e3;
      border-radius:10px;
      background:#fff;
      color:#344054;
      font-weight:800;
      cursor:pointer;
    }

    .zoom-btn:hover:not(:disabled){
      border-color:#8db9e6;
      background:#f3f8fe;
      color:var(--blue-dark);
    }

    .zoom-btn:disabled{cursor:not-allowed;opacity:.38}

    .zoom-value{
      min-width:58px;
      text-align:center;
      color:#344054;
      font-weight:800;
      font-size:13px;
    }

    .map-scroll{
      width:100%;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      background:#0d2537;
      max-height:78vh;
      overscroll-behavior:contain;
    }

    .map-scroll.can-pan{cursor:grab}
    .map-scroll.is-panning{cursor:grabbing;user-select:none}

    .map-stage{
      position:relative;
      width:100%;
      min-width:860px;
      line-height:0;
      transform-origin:top left;
    }

    .map-stage img{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
      image-rendering:auto;
    }

    .hotspot-layer{position:absolute;inset:0;pointer-events:none}

    .map-feature-layer{
      position:absolute;
      inset:0;
      z-index:35;
      overflow:hidden;
      pointer-events:none;
    }

    .innovation-zone-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .innovation-zone-shape{
      fill:rgba(250,204,21,.31);
      stroke:#ff5a1f;
      stroke-width:5;
      vector-effect:non-scaling-stroke;
      filter:drop-shadow(0 0 5px rgba(255,255,255,.92));
    }
    .innovation-zone-label{
      position:absolute;
      left:80%;
      top:38%;
      transform:translate(-50%,-50%);
      padding:8px 11px;
      border:2px solid #fff;
      border-radius:9px;
      background:#0797d5;
      color:#fff;
      font-size:12px;
      font-weight:900;
      line-height:1.25;
      white-space:nowrap;
      box-shadow:0 5px 15px rgba(15,23,42,.32);
    }
    .smoking-marker{
      position:absolute;
      width:32px;
      height:42px;
      transform:translate(-50%,-100%);
      filter:drop-shadow(0 3px 3px rgba(15,23,42,.48));
    }
    .smoking-marker svg{display:block;width:100%;height:100%}
    .smoking-marker .smoking-pin{fill:#ef3b24;stroke:#fff;stroke-width:2.5}
    .smoking-marker .smoking-symbol{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

    .map-hotspot{
      position:absolute;
      width:38px;
      height:38px;
      transform:translate(-50%,-50%);
      border-radius:999px;
      border:0;
      padding:0;
      background:transparent;
      z-index:10;
      cursor:default;
      pointer-events:auto;
    }

    .map-hotspot.is-linked{cursor:pointer}

    .map-hotspot.is-linked:hover{
      background:rgba(255,255,255,.22);
      box-shadow:0 0 0 3px rgba(255,255,255,.92),0 0 0 7px rgba(11,92,171,.62);
    }

    .map-hotspot.search-hit{z-index:30!important}

    .map-hotspot.search-hit::before{
      content:"";
      position:absolute;
      inset:-10px;
      border:4px solid #ff2d55;
      border-radius:999px;
      box-shadow:0 0 0 7px rgba(255,255,255,.94),0 0 28px rgba(255,45,85,.95);
      animation:flashRing .58s ease-in-out 6 alternate;
      pointer-events:none;
    }

    .map-hotspot.search-hit::after{
      content:attr(data-label);
      position:absolute;
      left:50%;
      top:-43px;
      transform:translateX(-50%);
      background:#111827;
      color:#fff;
      line-height:1;
      padding:9px 11px;
      border-radius:9px;
      white-space:nowrap;
      font-size:12px;
      font-weight:800;
      box-shadow:0 8px 20px rgba(0,0,0,.20);
      pointer-events:none;
    }

    @keyframes flashRing{
      from{opacity:.25;transform:scale(.80)}
      to{opacity:1;transform:scale(1.18)}
    }

    .map-hint{
      display:flex;
      flex-wrap:wrap;
      gap:10px 18px;
      align-items:center;
      padding:13px 17px;
      border-top:1px solid var(--line);
      background:#fbfcfe;
      color:#697586;
      font-size:13px;
      line-height:1.45;
    }

    .dot{
      display:inline-block;
      width:9px;
      height:9px;
      border-radius:50%;
      margin-right:6px;
      background:var(--blue);
    }

    .map-toolbar-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

    .facility-master-btn{
      height:36px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:0 12px;
      border:1px solid #ccd7e3;
      border-radius:10px;
      background:#fff;
      color:#344054;
      font-weight:850;
      cursor:pointer;
      white-space:nowrap;
    }

    .facility-master-btn:hover,
    .facility-master-btn.is-open{
      border-color:#8db9e6;
      background:#f3f8fe;
      color:var(--blue-dark);
    }

    .facility-master-icon{font-size:15px;line-height:1}

    .facility-master-count{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:23px;
      height:20px;
      padding:0 6px;
      border-radius:999px;
      background:#eef2f6;
      color:#667085;
      font-size:10px;
      font-weight:900;
    }

    .facility-master-btn.has-active .facility-master-count{
      background:#d9ebfc;
      color:var(--blue-dark);
    }

    .facility-panel{
      border-bottom:1px solid var(--line);
      background:#fff;
      padding:13px 14px 14px;
    }

    .facility-panel[hidden]{display:none}

    .facility-panel-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:11px;
    }

    .facility-panel-title{
      display:block;
      margin-bottom:3px;
      font-size:13px;
      font-weight:900;
      color:#344054;
    }

    .facility-panel-help{
      color:#7a8492;
      font-size:11px;
      line-height:1.45;
    }

    .facility-all-actions{
      display:flex;
      gap:6px;
      flex-shrink:0;
    }

    .facility-small-btn{
      height:30px;
      padding:0 10px;
      border:1px solid #d4dde7;
      border-radius:9px;
      background:#fff;
      color:#475467;
      font-size:11px;
      font-weight:850;
      cursor:pointer;
      white-space:nowrap;
    }

    .facility-small-btn:hover{background:#f6f8fb;color:#1d2939}

    .facility-category-buttons{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .facility-category-btn{
      --cat:#64748b;
      min-height:36px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border:1px solid #d7e0e9;
      border-radius:999px;
      background:#fff;
      color:#475467;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
      transition:.15s ease;
    }

    .facility-category-btn:hover{
      border-color:var(--cat);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--cat) 12%,transparent);
    }

    .facility-category-btn.is-active{
      border-color:var(--cat);
      background:color-mix(in srgb,var(--cat) 10%,white);
      color:#1f2937;
    }

    .facility-category-icon{
      width:22px;
      height:22px;
      display:inline-grid;
      place-items:center;
      border-radius:50%;
      background:var(--cat);
      color:#fff;
      font-size:12px;
      line-height:1;
      box-shadow:0 2px 6px rgba(15,23,42,.16);
    }

    .facility-category-icon svg,
    .facility-marker-icon svg{
      width:15px;
      height:15px;
      display:block;
      fill:none;
      stroke:currentColor;
      stroke-width:2.15;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .facility-category-count{
      color:#8490a2;
      font-size:10px;
      font-weight:900;
    }

    .facility-layer{
      position:absolute;
      inset:0;
      z-index:40;
      pointer-events:none;
    }

    .facility-leader{z-index:40;border-radius:999px}
    .facility-leader::before{
      content:"";
      position:absolute;
      left:-5px;
      top:50%;
      width:10px;
      height:10px;
      transform:translateY(-50%);
      border:2px solid #fff;
      border-radius:50%;
      background:#ff2d55;
      box-shadow:0 0 7px rgba(255,45,85,.95);
    }

    .facility-marker{
      --cat:#64748b;
      --dx:0px;
      --dy:-32px;
      position:absolute;
      width:34px;
      height:34px;
      display:none;
      place-items:center;
      border:2px solid rgba(255,255,255,.96);
      border-radius:50%;
      padding:0;
      background:var(--cat);
      color:#fff;
      box-shadow:0 5px 15px rgba(15,23,42,.28),0 0 0 1px rgba(15,23,42,.10);
      transform:translate(-50%,-50%) translate(var(--dx),var(--dy));
      transform-origin:center;
      cursor:pointer;
      pointer-events:auto;
      z-index:41;
      transition:filter .14s ease,box-shadow .14s ease;
    }

    .facility-marker.is-visible{display:grid}

    .facility-marker:hover,
    .facility-marker.is-selected{
      filter:brightness(1.08);
      box-shadow:0 7px 20px rgba(15,23,42,.34),0 0 0 4px rgba(255,255,255,.86),0 0 0 7px color-mix(in srgb,var(--cat) 45%,transparent);
      z-index:65;
    }


    .facility-marker.search-hit{
      display:grid;
      z-index:72;
      animation:facilitySearchPulse .58s ease-in-out 6 alternate;
    }

    .facility-marker.search-hit::after{
      content:"";
      position:absolute;
      inset:-8px;
      border:4px solid #ff2d55;
      border-radius:16px;
      box-shadow:0 0 0 6px rgba(255,255,255,.92),0 0 26px rgba(255,45,85,.88);
      pointer-events:none;
    }

    @keyframes facilitySearchPulse{
      from{filter:brightness(.90)}
      to{filter:brightness(1.15)}
    }

    .facility-marker-icon{font-size:16px;line-height:1;pointer-events:none}

    .facility-marker-icon svg{width:18px;height:18px}

    /* 브랜드가 있는 편의점/카페는 작은 로고·워드마크 카드로 표시 */
    .facility-marker.has-brand{
      width:54px;
      height:40px;
      border-radius:12px;
      background:#fff;
      padding:3px 5px;
      overflow:hidden;
    }

    .facility-brand-shell{
      --brand-bg:#fff;
      --brand-fg:#172033;
      width:100%;
      height:100%;
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:8px;
      background:var(--brand-bg);
      color:var(--brand-fg);
      overflow:hidden;
      pointer-events:none;
    }

    .facility-brand-logo{
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center;
      pointer-events:none;
    }

    .facility-brand-fallback{
      display:none;
      align-items:center;
      justify-content:center;
      width:100%;
      height:100%;
      padding:2px 3px;
      text-align:center;
      font-size:8px;
      font-weight:950;
      line-height:1.02;
      letter-spacing:-.025em;
      white-space:pre-line;
      word-break:keep-all;
      pointer-events:none;
    }

    .facility-marker.brand-failed .facility-brand-logo{display:none}
    .facility-marker.brand-failed .facility-brand-fallback{display:flex}

    .facility-brand-wordmark{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      height:100%;
      padding:2px 3px;
      text-align:center;
      font-size:8px;
      font-weight:950;
      line-height:1.02;
      letter-spacing:-.035em;
      white-space:pre-line;
      word-break:keep-all;
      pointer-events:none;
    }

    .facility-brand-shell.brand-bluepot{--brand-bg:#f3f7ff;--brand-fg:#24549a}
    .facility-brand-shell.brand-ing{--brand-bg:#fff;--brand-fg:#d83b33}
    .facility-brand-shell.brand-dailybeetle{--brand-bg:#f2fbef;--brand-fg:#3d6f38}
    .facility-brand-shell.brand-ripple{--brand-bg:#f8f3ec;--brand-fg:#54473d}
    .facility-brand-shell.brand-ogada{--brand-bg:#fbf6eb;--brand-fg:#80652c}
    .facility-brand-shell.brand-barva{--brand-bg:#f1f7f3;--brand-fg:#2f5c47}
    .facility-brand-shell.brand-thebake{--brand-bg:#fff8e8;--brand-fg:#765116}
    .facility-brand-shell.brand-hanyangbakery{--brand-bg:#eef5fb;--brand-fg:#0b5cab}
    .facility-brand-shell.brand-grazie{--brand-bg:#fff;--brand-fg:#694a31}
    .facility-brand-shell.brand-emart24{--brand-bg:#57585b;--brand-fg:#ffb71b}

    .facility-marker.is-group{
      width:auto;max-width:150px;min-width:90px;height:auto;min-height:44px;
      padding:7px 10px;border-radius:12px;background:#fff;color:#172033;
      text-align:center;gap:3px;line-height:1.25;
    }
    .facility-group-name{font-size:11px;font-weight:850;overflow-wrap:anywhere}
    .facility-group-count{font-size:10px;color:#526174;font-weight:750}
    .facility-popup{
      position:fixed;inset:0;margin:auto;width:min(460px,calc(100vw - 24px));
      max-height:calc(100dvh - 48px);padding:22px;border:1px solid #dbe3ec;
      border-radius:18px;background:#fff;color:#172033;
      box-shadow:0 20px 60px #0f172a40;line-height:1.5;overflow:auto;
    }
    .facility-popup::backdrop{background:rgba(15,23,42,.28)}
    .facility-popup-header{position:sticky;top:-22px;background:#fff;z-index:2;padding:8px 48px 12px 0}
    .facility-popup-close{
      position:absolute;top:8px;right:8px;width:44px;height:44px;
      border:0;border-radius:50%;background:transparent;color:#667085;
      font-size:24px;cursor:pointer;
    }
    .facility-floor{margin-top:18px;border-top:1px solid #e5ebf2;padding-top:12px}
    .facility-floor h3{margin:0 0 8px;font-size:15px;color:#155da4}
    .facility-floor ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
    .facility-floor li{padding:10px 12px;border-radius:10px;background:#f6f8fb}
    .facility-floor li.is-search-result{background:#fff4dc;outline:2px solid #c8790b}
    .facility-item-name{display:block;font-size:14px;font-weight:800}
    .facility-item-link{color:#075fae;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
    .facility-item-link:hover{color:#004987}
    .facility-item-category{font-size:11px;color:#58677b}
    .facility-item-detail{margin-top:4px;font-size:12px;color:#4b596c;overflow-wrap:anywhere}
    .facility-scope-btn{min-height:44px;margin-top:12px;padding:8px 12px;border:1px solid #cad8e8;border-radius:9px;background:#f1f6fc;color:#18558c;font-weight:750;cursor:pointer}
    .facility-popup :focus-visible{outline:3px solid #287acd;outline-offset:3px}
    @media(max-width:600px){
      .facility-popup{inset:auto 12px 12px;margin:0;width:auto;max-height:72dvh;padding:20px 16px;padding-bottom:max(20px,env(safe-area-inset-bottom));}
    }

    .facility-popup-close:hover{background:#f1f4f7;color:#344054}

    .facility-popup-category{
      display:flex;
      align-items:center;
      gap:7px;
      margin:0 30px 7px 0;
      color:#667085;
      font-size:11px;
      font-weight:850;
    }

    .facility-popup-icon{
      --cat:#64748b;
      width:24px;
      height:24px;
      display:inline-grid;
      place-items:center;
      border-radius:50%;
      background:var(--cat);
      color:#fff;
      font-size:12px;
      box-shadow:0 2px 6px rgba(15,23,42,.15);
    }

    .facility-popup-name{
      display:block;
      padding-right:22px;
      margin-bottom:6px;
      font-size:15px;
      font-weight:900;
      letter-spacing:-.02em;
      line-height:1.3;
    }

    .building-group{

      border-radius:15px;

      font-size:13px;
      color:#475467;

    .building-row{
      position:relative;
      display:grid;
      grid-template-columns:48px minmax(0,1fr) auto;

      align-items:center;
      min-height:45px;
      padding:8px 12px;

      color:inherit;
      text-decoration:none;
      background:#fff;
      transition:.16s ease;

      width:100%;
      border:0;
      border-bottom:1px solid #eef2f6;
      text-align:left;
      font:inherit;
    }

    .building-row.is-linked{cursor:pointer}
    .building-row.is-linked:hover{background:#f5f9fe}
    .building-row.is-unlinked{color:#7a8492;cursor:default}

    .building-id{
      font-weight:900;
      color:var(--blue-dark);
      font-variant-numeric:tabular-nums;
    }

    .is-unlinked .building-id{color:#778396}

    .building-name{
      min-width:0;
      font-size:13px;
      font-weight:700;
      line-height:1.35;
      word-break:keep-all;
      overflow-wrap:anywhere;

      flex-shrink:0;
      border-radius:999px;
      padding:5px 8px;
      font-size:10px;
      font-weight:800;
      line-height:1;
      white-space:nowrap;

    .is-linked .building-status{background:var(--blue-soft);color:var(--blue-dark)}
    .is-unlinked .building-status{background:#f1f3f5;color:#8a94a3}

    .building-row.search-hit{
      z-index:2;
      background:#fff8cb;
      box-shadow:inset 0 0 0 3px #ff2d55;
      animation:listFlash .58s ease-in-out 6 alternate;
    }

    @keyframes listFlash{
      from{filter:brightness(.96)}
      to{filter:brightness(1.08)}
    }

    .footer{
      display:flex;
      justify-content:space-between;
      gap:16px;
      margin:14px 2px 0;
      color:#8a94a3;
      font-size:12px;
      line-height:1.6;
    }

    .footer-version{white-space:nowrap;font-weight:750}

    body.debug .map-hotspot{

      box-shadow:inset 0 0 0 2px rgba(255,0,0,.78);
    }

    @media (max-width:1050px){

      .facility-panel-top{flex-direction:column}
      .facility-all-actions{align-self:flex-end}
    }

    @media (max-width:1200px){
      .directory-body{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

    @media (max-width:900px){
      .page{padding:14px}
      .hero{grid-template-columns:1fr;gap:14px}
      .hero-controls{align-items:stretch}
      .language-switch{align-self:flex-end}
      .search-panel{width:100%}
      .map-card,.directory{border-radius:14px}
      .map-stage{min-width:1050px}
      .map-scroll{max-height:72vh}
      .map-toolbar-actions{width:100%;flex-wrap:wrap}
      .facility-master-btn{margin-right:auto}
      .zoom-controls{margin-left:auto}
      .facility-panel{padding:12px}
      .facility-category-buttons{gap:6px}

      .directory-body{grid-template-columns:1fr;padding:13px}
      .directory-head{align-items:flex-start;flex-direction:column;padding:18px}

      html[lang="zh-CN"] .building-status{grid-column:2;justify-self:start;margin-top:1px}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important}
      .map-hotspot.search-hit::before,.building-row.search-hit,
      .facility-marker.search-hit{animation:none}
    }

  <main class="page">
    <section class="hero">
      <div class="title-wrap">
        <div class="version">V2.7.0 · DINING & MAP ZONES</div>

        <p id="pageDescription"></p>
      </div>

      <div class="hero-controls">
        <div class="language-switch" id="languageSwitch" role="group" aria-label="언어 선택">
          <button class="language-btn" type="button" data-lang="ko" aria-pressed="true">한국어</button>
          <button class="language-btn" type="button" data-lang="en" aria-pressed="false">English</button>
          <button class="language-btn" type="button" data-lang="zh" aria-pressed="false">中文</button>
        </div>

        <div class="search-panel">
          <div class="search-box">
            <input id="searchInput" type="search" autocomplete="off" />

          </div>

        </div>
      </div>
    </section>

    <div class="message" id="message" aria-live="polite"></div>

    <section class="map-card">
      <div class="map-toolbar">
        <div class="label" id="mapToolbarLabel"></div>

        <div class="map-toolbar-actions">
          <button class="facility-master-btn" id="facilityMasterBtn" type="button" aria-expanded="true">
            <span class="facility-master-icon" aria-hidden="true">⌖</span>
            <span id="facilityMasterLabel"></span>
            <span class="facility-master-count" id="facilityMasterCount">0</span>

          <div class="zoom-controls" id="zoomControls">
            <button class="zoom-btn" id="zoomOut" type="button">−</button>
            <span class="zoom-value" id="zoomValue">100%</span>
            <button class="zoom-btn" id="zoomIn" type="button">＋</button>
            <button class="zoom-btn" id="zoomReset" type="button">100%</button>
          </div>
        </div>
      </div>

      <div class="facility-panel" id="facilityPanel">
        <div class="facility-panel-top">
          <div>
            <strong class="facility-panel-title" id="facilityPanelTitle"></strong>
            <div class="facility-panel-help" id="facilityPanelHelp"></div>
          </div>
          <div class="facility-all-actions">
            <button class="facility-small-btn" id="facilityAllOn" type="button"></button>
            <button class="facility-small-btn" id="facilityAllOff" type="button"></button>
          </div>
        </div>
        <div class="facility-category-buttons" id="facilityCategoryButtons"></div>
      </div>

      <div class="map-scroll" id="mapScroll">
        <div class="map-stage" id="mapStage">
          <img id="campusMap" src="assets/erica-map-ko.jpg" alt="한양대학교 ERICA 캠퍼스 항공 지도" width="4096" height="1860" />
          <div class="hotspot-layer" id="hotspotLayer"></div>
          <div class="map-feature-layer" id="mapFeatureLayer"></div>
          <div class="facility-layer" id="facilityLayer"></div>

        </div>
      </div>

      <div class="map-hint">
        <span id="hintLinked"><i class="dot"></i><span></span></span>
        <span id="hintSearch"></span>
      </div>
    </section>

    <section class="directory" id="directory">
      <div class="directory-head">
        <div>
          <h2 id="directoryTitle"></h2>
          <p id="directoryDescription"></p>
        </div>
        <div class="directory-legend">
          <span id="legendLinked"></span>
          <span id="legendPending"></span>
        </div>
      </div>

      <div class="directory-body" id="directoryBody"></div>
    </section>

    <footer class="footer">
      <span id="footerText"></span>
      <span class="footer-version">V2.7.0 · DINING & MAP ZONES</span>
    </footer>
  </main>

function normalizeLanguageCode(lang){
  if(!lang) return null;

  return value;
}

function t(){ return UI[currentLang] || UI.ko; }
function localizedValue(obj,prefix){
  const suffix = LANGUAGE_SUFFIX[currentLang] || "Ko";
  const value = obj?.[`${prefix}${suffix}`];
  if(value !== undefined && value !== null && String(value).trim() !== "") return value;
  return obj?.[`${prefix}Ko`] || "";
}
function displayName(b){ return localizedValue(b,"name"); }
function facilityDisplayName(f){ return localizedValue(f,"name"); }
function mapFeatureDisplayName(feature){ return localizedValue(feature,"name"); }
function facilityFloor(f){ return localizedValue(f,"floor"); }
function facilityDetail(f){ return localizedValue(f,"detail"); }

function facilityBrandMarkup(f,c){
  if(f.brandLogo){
    const brandClass = f.brandClass ? ` ${escapeHtml(f.brandClass)}` : "";
    const bg = f.brandBg || "#ffffff";
    const fg = f.brandFg || "#172033";
    return `<span class="facility-brand-shell${brandClass}" style="--brand-bg:${escapeHtml(bg)};--brand-fg:${escapeHtml(fg)}">
      <img class="facility-brand-logo" src="${escapeHtml(f.brandLogo)}" alt="" loading="lazy" referrerpolicy="no-referrer">
      <span class="facility-brand-fallback">${escapeHtml(f.brandText || facilityDisplayName(f))}</span>
    </span>`;
  }
  if(f.brandText){
    const brandClass = f.brandClass ? ` ${escapeHtml(f.brandClass)}` : "";
    return `<span class="facility-brand-shell${brandClass}"><span class="facility-brand-wordmark">${escapeHtml(f.brandText)}</span></span>`;
  }
  return `<span class="facility-marker-icon" aria-hidden="true">${c.icon}</span>`;
}
function facilityCategoryLabel(key){
  const c = FACILITY_CATEGORIES[key];
  return c?.[currentLang] || c?.ko || key;
}
function buildingById(id){ return BUILDINGS.find(b => b.id === id); }

function buildingUrl(b){
  const koreanUrl = (b.urlKo || "").trim();
  if(currentLang === "ko") return koreanUrl;
  if(currentLang === "en"){
    const englishUrl = (b.urlEn || "").trim();
    if(englishUrl) return englishUrl;
    return SETTINGS.englishUrlFallbackToKorean ? koreanUrl : "";
  }
  if(currentLang === "zh"){
    const chineseUrl = (b.urlZh || "").trim();
    if(chineseUrl) return chineseUrl;
    return SETTINGS.chineseUrlFallbackToKorean ? koreanUrl : "";
  }
  return koreanUrl;
}

function buildingExtraLinks(b){
  return (b.links || [])
    .map(link => ({label:localizedValue(link,"label"),url:String(link.url || "").trim()}))
    .filter(link => link.url);
}

function hasUrl(b){ return buildingUrl(b).length > 0 || buildingExtraLinks(b).length > 0; }
function hasGuideLinks(b){ return b.linkType === "guide" || buildingExtraLinks(b).length > 0; }
function buildingOpenTitle(b){ return hasGuideLinks(b) ? t().openGuideTitle(b.id,displayName(b)) : t().openTitle(b.id,displayName(b)); }
function buildingOpenAria(b){ return hasGuideLinks(b) ? t().openGuideAria(b.id,displayName(b)) : t().openAria(b.id,displayName(b)); }

function normalize(s){
  return String(s ?? "")
    .toLowerCase()
    .normalize("NFKC")
    .replace(/[^\p{L}\p{N}]+/gu,"");
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function convertedY(originalPercent){
  return originalPercent * ORIGINAL_MAP_HEIGHT / CROPPED_MAP_HEIGHT;
}

function updateUrlLanguage(){
  const next = new URL(location.href);
  if(currentLang === "ko") next.searchParams.delete("lang");

  history.replaceState(null,"",next);
}

function groupFacilitiesByBuilding(facilities){
  const groups = new Map();
  facilities.forEach(f => {
    if(!groups.has(f.buildingId)) groups.set(f.buildingId,[]);
    groups.get(f.buildingId).push(f);
  });
  return groups;
}

function groupFacilitiesByFloor(facilities){
  const floors = new Map();
  facilities.forEach(f => {
    const key = f.floorEn || f.floorKo || "";
    if(!floors.has(key)) floors.set(key,[]);
    floors.get(key).push(f);
  });
  const rank = key => {
    const match = key.match(/^(B)?(\d+)/i);
    return match ? Number(match[2]) * (match[1] ? -1 : 1) : -Infinity;
  };
  return [...floors.entries()].sort((a,b) => rank(b[0])-rank(a[0]));
}

function layoutFacilityMarkers(){
  facilityLayer.querySelectorAll(".facility-leader").forEach(el => el.remove());
  const placed = [];
  const candidates = [];
  for(let dx=-240;dx<=240;dx+=24){
    for(let shift=-240;shift<=240;shift+=24) candidates.push({dx,dy:shift-34,score:dx*dx+shift*shift});
  }
  candidates.sort((a,b) => a.score-b.score);
  for(const marker of new Set(facilityMarkerEls.values())){
    const x = marker.offsetLeft, y = marker.offsetTop;
    const width = marker.offsetWidth, height = marker.offsetHeight;
    const rect = ({dx,dy}) => ({left:x+dx-width/2,right:x+dx+width/2,top:y+dy-height/2,bottom:y+dy+height/2});
    const position = candidates.find(candidate => {
      const r = rect(candidate);
      return r.left >= 0 && r.right <= stage.clientWidth && r.top >= 0 && r.bottom <= stage.clientHeight &&
        !placed.some(other => r.right+6 > other.left && r.left-6 < other.right && r.bottom+6 > other.top && r.top-6 < other.bottom);
    }) || {dx:0,dy:-34};
    marker.dataset.dx = String(position.dx);
    marker.dataset.dy = String(position.dy);
    marker.style.setProperty("--dx",`${position.dx}px`);
    marker.style.setProperty("--dy",`${position.dy}px`);
    placed.push(rect(position));
    const line = document.createElement("span");
    line.className = "facility-leader";
    line.setAttribute("aria-hidden","true");
    Object.assign(line.style,{position:"absolute",left:`${x}px`,top:`${y}px`,width:`${Math.hypot(position.dx,position.dy)}px`,height:"4px",background:"#ff2d55",boxShadow:"0 0 0 2px rgba(255,255,255,.96),0 0 8px rgba(255,45,85,.95)",transformOrigin:"0 50%",transform:`rotate(${Math.atan2(position.dy,position.dx)}rad)`,pointerEvents:"none"});
    facilityLayer.appendChild(line);
  }
}
new ResizeObserver(layoutFacilityMarkers).observe(stage);

function openBuildingFacilities(buildingId,marker,showAll=false,highlightId=null){
  const b = buildingById(buildingId);
  if(!b || !marker.isConnected) return;
  const all = FACILITIES.filter(f => f.buildingId === buildingId);
  const items = showAll ? all : all.filter(f => activeFacilityCategories.has(f.category));
  if(!items.length) return;
  selectedFacilityId = highlightId;
  new Set(facilityMarkerEls.values()).forEach(el => el.classList.toggle("is-selected",el === marker));
  const floors = groupFacilitiesByFloor(items).map(([,facilities]) => `
    <section class="facility-floor">
      <h3>${escapeHtml(facilityFloor(facilities[0]) || t().floorUnknown)}</h3>
      <ul>${facilities.map(f => `<li data-facility-id="${escapeHtml(f.id)}"${f.id === highlightId ? ' class="is-search-result"' : ''}>
        ${f.url
          ? `<a class="facility-item-name facility-item-link" href="${escapeHtml(f.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(facilityDisplayName(f))} ↗</a>`
          : `<span class="facility-item-name">${escapeHtml(facilityDisplayName(f))}</span>`}
        <span class="facility-item-category">${escapeHtml(facilityCategoryLabel(f.category))}</span>
        ${facilityDetail(f) ? `<div class="facility-item-detail">${escapeHtml(facilityDetail(f))}</div>` : ""}
      </li>`).join("")}</ul>
    </section>`).join("");
  facilityPopup.innerHTML = `
    <header class="facility-popup-header">
    <button class="facility-popup-close" type="button" aria-label="${escapeHtml(t().facilityCloseAria)}">×</button>
    <div class="facility-popup-category">${escapeHtml(t().facilityFloors)}</div>
    <h2 class="facility-popup-name" id="facilityPopupTitle">${escapeHtml(displayName(b))}</h2>
    <div class="facility-popup-location">${escapeHtml(t().facilityCount(items.length))}</div>
    </header>
    ${all.length > all.filter(f => activeFacilityCategories.has(f.category)).length ? `<button class="facility-scope-btn" type="button">${escapeHtml(showAll ? t().facilityFiltered : t().facilityAll)}</button>` : ""}
    ${floors}
    ${hasUrl(b) ? `<a class="facility-popup-link" href="${escapeHtml(buildingUrl(b))}" target="_blank" rel="noopener noreferrer">${escapeHtml(t().facilityFloorPlan)}</a>` : ""}
  `;
  facilityPopup.querySelector(".facility-popup-close").addEventListener("click",closeFacilityPopup);
  facilityPopup.querySelector(".facility-scope-btn")?.addEventListener("click",() => {
    openBuildingFacilities(buildingId,marker,!showAll,highlightId);
    facilityPopup.querySelector(".facility-scope-btn")?.focus({preventScroll:true});
  });
  if(!facilityPopup.open) facilityPopup.showModal();
  facilityPopup.querySelector(".is-search-result")?.scrollIntoView({block:"nearest"});
}

function openFacilityPopup(f,marker){
  openBuildingFacilities(f.buildingId,marker,false,f.id);
}

  const links = buildingExtraLinks(b);

  facilityPopup.innerHTML = `

      <button class="facility-popup-close" type="button" aria-label="${escapeHtml(t().facilityCloseAria)}">×</button>
      <div class="facility-popup-category">${escapeHtml(t().placeLinks)}</div>
      <h2 class="facility-popup-name" id="facilityPopupTitle">${escapeHtml(displayName(b))}</h2>
    </header>
    <div>${links.map(link => `<a class="facility-popup-link" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.label)} →</a>`).join(" ")}</div>
  `;
  facilityPopup.querySelector(".facility-popup-close").addEventListener("click",closeFacilityPopup);
  if(!facilityPopup.open) facilityPopup.showModal();
}

function closeFacilityPopup(){
  selectedFacilityId = null;
  if(facilityPopup.open) facilityPopup.close();
  new Set(facilityMarkerEls.values()).forEach(el => el.classList.remove("is-selected"));
}
facilityPopup.addEventListener("close",() => {
  selectedFacilityId = null;
  new Set(facilityMarkerEls.values()).forEach(el => el.classList.remove("is-selected"));
});
facilityPopup.addEventListener("click",event => {
  const rect = facilityPopup.getBoundingClientRect();
  if(event.target === facilityPopup && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) closeFacilityPopup();
});


facilityMasterBtn.addEventListener("click",() => toggleFacilityPanel());
facilityAllOn.addEventListener("click",() => setAllFacilityCategories(true));
facilityAllOff.addEventListener("click",() => setAllFacilityCategories(false));

function groupKey(b){ return b.group || b.id.charAt(0); }

function renderDirectory(){
  directoryBody.replaceChildren();
  rowEls.clear();
  const groups = new Map();

  BUILDINGS.forEach(b => {
    const key = groupKey(b);
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(b);
  });

  groups.forEach((items,key) => {
    const group = document.createElement("section");
    group.className = "building-group";

    const h3 = document.createElement("h3");
    h3.textContent = key === "places" ? t().placesGroup : t().group(key);
    group.appendChild(h3);

    const list = document.createElement("div");
    list.className = "building-list";

    items.forEach(b => {
      const linked = hasUrl(b);
      const extraLinks = buildingExtraLinks(b);
      const name = displayName(b);
      const row = document.createElement(extraLinks.length ? "button" : (linked ? "a" : "div"));
      row.className = "building-row " + (linked ? "is-linked" : "is-unlinked");
      row.dataset.id = b.id;

      if(linked){
        if(extraLinks.length){
          row.type = "button";
          row.addEventListener("click",() => openBuildingLinks(b));
        }else{
          row.href = buildingUrl(b);
          row.target = "_blank";
          row.rel = "noopener noreferrer";
        }
        row.title = buildingOpenTitle(b);
        row.setAttribute("aria-label",buildingOpenAria(b));
      }

      row.innerHTML = `
        <span class="building-id">${escapeHtml(b.id)}</span>
        <span class="building-name">${escapeHtml(name)}</span>
        <span class="building-status">${linked ? (hasGuideLinks(b) ? t().viewGuide : t().view) : t().pending}</span>
      `;

      list.appendChild(row);
      rowEls.set(b.id,row);
    });

    group.appendChild(list);
    directoryBody.appendChild(group);
  });
}

function applyLanguage({preserveSearch=true,updateUrl=true}={}){
  const ui = t();
  document.documentElement.lang = currentLang === "zh" ? "zh-CN" : currentLang;
  document.title = ui.title;
  document.querySelector('meta[name="description"]').setAttribute("content",ui.metaDescription);

  pageTitle.textContent = ui.title;
  pageDescription.innerHTML = ui.description;
  languageSwitch.setAttribute("aria-label",ui.languageLabel);
  searchInput.placeholder = ui.searchPlaceholder;
  searchInput.setAttribute("aria-label",ui.searchAria);
  clearBtn.setAttribute("aria-label",ui.clearAria);
  searchBtn.textContent = ui.searchButton;
  mapToolbarLabel.textContent = ui.toolbar;
  zoomControls.setAttribute("aria-label",ui.zoomAria);
  zoomOut.setAttribute("aria-label",ui.zoomOutAria);
  zoomIn.setAttribute("aria-label",ui.zoomInAria);
  zoomReset.setAttribute("aria-label",ui.resetAria);
  campusMap.src = SETTINGS.mapImages[currentLang];
  campusMap.alt = ui.mapAlt;
  hintLinked.textContent = ui.hintLinked;
  hintSearch.textContent = ui.hintSearch;
  directoryTitle.textContent = ui.directoryTitle;
  directoryDescription.textContent = ui.directoryDescription;
  legendLinked.textContent = ui.legendLinked;
  legendPending.textContent = ui.legendPending;
  footerText.textContent = ui.footer;
  renderFacilityControls();
  renderFacilityMarkers();

  languageButtons.forEach(btn => {
    const active = btn.dataset.lang === currentLang;
    btn.classList.toggle("is-active",active);
    btn.setAttribute("aria-pressed",String(active));
  });

  renderMapHotspots();
  renderDirectory();
  clearHighlights();

  if(preserveSearch && searchInput.value.trim()) searchBuildings(false);
  else if(!params.has("debug")) message.textContent = "";

  saveLanguage(currentLang);
  if(updateUrl) updateUrlLanguage();
  if(params.get("debug") === "1") message.innerHTML = ui.debug;
}

languageButtons.forEach(btn => {
  btn.addEventListener("click",() => {
    if(btn.dataset.lang === currentLang) return;
    currentLang = btn.dataset.lang;
    applyLanguage();
  });
});

function updateZoom(nextZoom,focusX=.5,focusY=.5){
  const oldZoom = zoom;
  zoom = Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,nextZoom));

  if(zoom === oldZoom){ updateZoomControls(); return; }

  const oldWidth = stage.scrollWidth;
  const oldHeight = stage.scrollHeight;
  const viewportW = mapScroll.clientWidth;
  const viewportH = mapScroll.clientHeight;
  const contentX = (mapScroll.scrollLeft + viewportW * focusX) / Math.max(oldWidth,1);
  const contentY = (mapScroll.scrollTop + viewportH * focusY) / Math.max(oldHeight,1);
  const minStageWidth = parseFloat(getComputedStyle(stage).minWidth) || 0;

  stage.style.width = `max(${zoom * 100}%, ${zoom * minStageWidth}px)`;

  requestAnimationFrame(() => {
    const newWidth = stage.scrollWidth;
    const newHeight = stage.scrollHeight;
    mapScroll.scrollLeft = Math.max(0,contentX * newWidth - viewportW * focusX);
    mapScroll.scrollTop = Math.max(0,contentY * newHeight - viewportH * focusY);
    updateZoomControls();
  });
}

function updateZoomControls(){
  zoomValue.textContent = Math.round(zoom * 100) + "%";
  zoomOut.disabled = zoom <= ZOOM_MIN;
  zoomIn.disabled = zoom >= ZOOM_MAX;
  mapScroll.classList.toggle("can-pan",zoom > 1);
}

zoomOut.addEventListener("click",() => updateZoom(zoom - ZOOM_STEP));
zoomIn.addEventListener("click",() => updateZoom(zoom + ZOOM_STEP));
zoomReset.addEventListener("click",() => {
  zoom = 1;
  stage.style.width = "";
  mapScroll.scrollTo({left:0,top:0,behavior:"smooth"});
  updateZoomControls();
});

mapScroll.addEventListener("wheel",e => {
  if(!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const rect = mapScroll.getBoundingClientRect();
  const fx = Math.min(1,Math.max(0,(e.clientX - rect.left) / rect.width));
  const fy = Math.min(1,Math.max(0,(e.clientY - rect.top) / rect.height));
  updateZoom(zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP),fx,fy);
},{passive:false});

let panState = null;
mapScroll.addEventListener("pointerdown",e => {
  if(zoom <= 1 || e.button !== 0 || e.target.closest(".map-hotspot,.facility-marker,.facility-popup")) return;
  panState = {x:e.clientX,y:e.clientY,left:mapScroll.scrollLeft,top:mapScroll.scrollTop,id:e.pointerId};
  mapScroll.classList.add("is-panning");
  mapScroll.setPointerCapture(e.pointerId);
});
mapScroll.addEventListener("pointermove",e => {
  if(!panState || panState.id !== e.pointerId) return;
  mapScroll.scrollLeft = panState.left - (e.clientX - panState.x);
  mapScroll.scrollTop = panState.top - (e.clientY - panState.y);
});
function stopPan(e){
  if(!panState || (e && panState.id !== e.pointerId)) return;
  panState = null;
  mapScroll.classList.remove("is-panning");
}
mapScroll.addEventListener("pointerup",stopPan);
mapScroll.addEventListener("pointercancel",stopPan);
mapScroll.addEventListener("click",e => {
  if(e.target.closest(".facility-marker,.facility-popup,.map-hotspot")) return;
  closeFacilityPopup();
});

function clearHighlights(){
  document.querySelectorAll(".search-hit").forEach(el => el.classList.remove("search-hit"));
}

function highlightBuilding(b,shouldScroll=true){
  const mapEl = mapEls.get(b.id);
  const rowEl = rowEls.get(b.id);

  if(mapEl){
    mapEl.classList.remove("search-hit");
    void mapEl.offsetWidth;
    mapEl.classList.add("search-hit");
  }

  if(rowEl){
    rowEl.classList.remove("search-hit");
    void rowEl.offsetWidth;
    rowEl.classList.add("search-hit");
  }

  if(shouldScroll && mapEl){
    mapScroll.scrollTo({
      left:Math.max(0,mapEl.offsetLeft - mapScroll.clientWidth / 2),
      top:Math.max(0,mapEl.offsetTop - mapScroll.clientHeight / 2),
      behavior:"smooth"
    });
  }
}

function facilityDirectSearchFields(f){
  return [
    f.id,
    f.nameKo,
    f.nameEn,
    f.nameZh,
    f.detailKo || "",
    f.detailEn || "",
    f.detailZh || "",
    ...(f.aliasesKo || []),
    ...(f.aliasesEn || []),
    ...(f.aliasesZh || [])
  ];
}

function facilityCategorySearchFields(f){
  const c = FACILITY_CATEGORIES[f.category];
  return [
    c?.ko || "",
    c?.en || "",
    c?.zh || "",
    ...(c?.aliasesKo || []),
    ...(c?.aliasesEn || []),
    ...(c?.aliasesZh || [])
  ];
}

function directFieldMatches(value,q){
  const normalized = normalize(value);
  // 'cafe'가 'cafeteria'까지 잡는 오탐은 막되, Cafe ING 같은 실제 카페명은 검색한다.
  if(q === "cafe"){
    const tokens = String(value ?? "")
      .toLowerCase()
      .normalize("NFKC")
      .split(/[^\p{L}\p{N}]+/gu)
      .filter(Boolean)
      .map(normalize);
    return tokens.includes("cafe");
  }
  return normalized.includes(q);
}

function facilityMatchesQuery(f,q){
  const directMatch = facilityDirectSearchFields(f).some(value => directFieldMatches(value,q));
  const categoryMatch = facilityCategorySearchFields(f).some(value => directFieldMatches(value,q));
  return directMatch || categoryMatch;
}

function activateFacilitySearchResults(facilities){
  if(!facilities.length) return;

  facilities.forEach(f => activeFacilityCategories.add(f.category));
  closeFacilityPopup();
  renderFacilityControls();
  updateFacilityVisibility();

  facilities.forEach(f => {
    const marker = facilityMarkerEls.get(f.id);
    if(!marker) return;
    marker.classList.remove("search-hit");
    void marker.offsetWidth;
    marker.classList.add("search-hit");
  });
}

function focusFacilityResult(f,shouldScroll=true,openPopup=false){
  const b = buildingById(f.buildingId);
  const marker = facilityMarkerEls.get(f.id);
  if(!b || !marker) return;

  highlightBuilding(b,false);

  if(shouldScroll){
    const dx = Number(marker.dataset.dx || 0);
    const dy = Number(marker.dataset.dy || 0);
    mapScroll.scrollTo({
      left:Math.max(0,marker.offsetLeft + dx - mapScroll.clientWidth / 2),
      top:Math.max(0,marker.offsetTop + dy - mapScroll.clientHeight / 2),
      behavior:"smooth"
    });
  }

  if(openPopup){
    openFacilityPopup(f,marker);
  }
}

function searchBuildings(shouldScroll=true){
  const raw = searchInput.value.trim();
  clearHighlights();
  closeFacilityPopup();

  if(!raw){
    message.textContent = "";
    clearBtn.style.display = "none";
    return;
  }

  clearBtn.style.display = "block";
  const q = normalize(raw);

  let buildingResults = BUILDINGS.filter(b => {
    const fields = [b.id,b.nameKo,b.nameEn,b.nameZh,...(b.aliasesKo || []),...(b.aliasesEn || []),...(b.aliasesZh || [])].map(normalize);
    return fields.some(v => v.includes(q));
  });

  const exactId = BUILDINGS.find(b => normalize(b.id) === q);
  if(exactId) buildingResults = [exactId];

  const facilityResults = exactId ? [] : FACILITIES.filter(f => facilityMatchesQuery(f,q));

  if(buildingResults.length === 0 && facilityResults.length === 0){
    message.innerHTML = t().noResult(escapeHtml(raw));
    return;
  }

  buildingResults.forEach((b,i) => highlightBuilding(b,shouldScroll && i === 0 && facilityResults.length === 0));

  if(facilityResults.length){
    activateFacilitySearchResults(facilityResults);
    facilityResults.forEach(f => {
      const b = buildingById(f.buildingId);
      if(b) highlightBuilding(b,false);
    });
    focusFacilityResult(facilityResults[0],shouldScroll,facilityResults.length === 1);
  }

  if(buildingResults.length && facilityResults.length){
    message.innerHTML = t().mixedResults(buildingResults,facilityResults);
  }else if(facilityResults.length === 1){
    const f = facilityResults[0];
    const b = buildingById(f.buildingId);
    message.innerHTML = b ? t().oneFacilityResult(f,b) : t().manyFacilityResults(facilityResults);
  }else if(facilityResults.length > 1){
    message.innerHTML = t().manyFacilityResults(facilityResults);
  }else{
    message.innerHTML = buildingResults.length === 1
      ? t().oneResult(buildingResults[0],hasUrl(buildingResults[0]))
      : t().manyResults(buildingResults);
  }
}

searchBtn.addEventListener("click",() => searchBuildings(true));
searchInput.addEventListener("keydown",e => { if(e.key === "Enter") searchBuildings(true); });
searchInput.addEventListener("input",() => { clearBtn.style.display = searchInput.value ? "block" : "none"; });
clearBtn.addEventListener("click",() => {
  searchInput.value = "";
  clearHighlights();
  closeFacilityPopup();
  message.textContent = "";
  clearBtn.style.display = "none";
  searchInput.focus();
});

if(params.get("debug") === "1") document.body.classList.add("debug");
updateZoomControls();
applyLanguage({preserveSearch:false,updateUrl:false});
</script>
